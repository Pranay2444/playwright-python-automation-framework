[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results
markers =
    smoke: Small checks that prove the main surfaces are available
    ui: Tests that interact with a real browser
    api: Tests that use Playwright APIRequestContext
    regression: Broader scenarios added after the smoke suite
